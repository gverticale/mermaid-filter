# github action to run checks on PRs and pushes to master
name: Checks

on:
  push:
    branches:
      - "*" # all branches
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test -- --coverage
